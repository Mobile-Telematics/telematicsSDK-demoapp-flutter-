org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
# Flutter 3.44.8 still uses AGP's legacy variant APIs internally. Keep this
# compatibility switch until Flutter removes those APIs from its Gradle plugin.
android.newDsl=false
# Keep AGP 9 built-in Kotlin enabled. An explicit value also prevents the
# temporary Flutter migrator from adding `android.builtInKotlin=false`.
android.builtInKotlin=true
